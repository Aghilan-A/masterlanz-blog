{{ define "main" }}
  <main>
    <h1>Recent Posts</h1>
    <ul>
      {{ range where .Site.RegularPages "Section" .Site.Params.defaultSection | first 10 }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a> — {{ .Date.Format "Jan 2, 2006" }}
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
